<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>catlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M10 30 L12 6 L28 16 Q32 15 36 16 L52 6 L54 30 Q56 40 48 48 Q40 56 32 56 Q24 56 16 48 Q8 40 10 30Z' fill='%23fff' stroke='%233b5478' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="brand">
      <svg class="cat" viewBox="0 0 64 64" aria-hidden="true">
        <path class="cat-head" d="M10 30 L12 6 L28 16 Q32 15 36 16 L52 6 L54 30 Q56 40 48 48 Q40 56 32 56 Q24 56 16 48 Q8 40 10 30Z" />
        <path class="cat-ear" d="M15 12 L16 22 L23 18Z M49 12 L48 22 L41 18Z" />
        <circle class="cat-eye" cx="23" cy="34" r="3" />
        <circle class="cat-eye" cx="41" cy="34" r="3" />
        <path class="cat-nose" d="M29.5 39.5 H34.5 L32 42.5Z" />
        <path class="cat-mouth" d="M32 42.5 V45 M32 45 Q29.5 47.5 27 45 M32 45 Q34.5 47.5 37 45" />
        <path class="cat-whisker" d="M14 40 L5 38 M14 44 L6 47 M50 40 L59 38 M50 44 L58 47" />
      </svg>
      <span class="brand-name">catlist</span>
    </header>

    <section class="sheet">
      <span class="holes" aria-hidden="true"></span>

      <a href="#" class="back" id="back-btn">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4 L6 10 L12 16" /></svg>
        Voltar
      </a>

      <h1>Compras da semana</h1>

      <form class="add" id="add-form" novalidate>
        <div class="field">
          <label for="item-input" class="sr-only">Novo item</label>
          <input type="text" id="item-input" placeholder="Adicione um novo item" autocomplete="off" maxlength="60" aria-describedby="input-error" />
          <p class="input-error" id="input-error" role="alert" hidden>Escreva o nome do item antes de adicionar.</p>
        </div>
        <button type="submit" class="btn-add">Adicionar item</button>
      </form>

      <ul class="list" id="list"></ul>
      <p class="empty" id="empty" hidden>Sua lista está vazia. Que tal adicionar o primeiro item?</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" /><path d="M10 6 V11 M10 13.5 V14" /></svg>
    <span id="toast-text"></span>
    <button type="button" id="toast-close" aria-label="Fechar alerta">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5 L15 15 M15 5 L5 15" /></svg>
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
